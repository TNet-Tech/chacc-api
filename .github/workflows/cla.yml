name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/YOUR_USERNAME/YOUR_REPO/blob/main/CLA.md'
          branch: 'develop'
          allowlist: bot*,dependabot[bot],github-actions[bot]
          create-file-commit-message: 'chore: create CLA signature file'
          custom-notsigned-prcomment: |
            👋 Thanks for your contribution!

            Before we can merge this Pull Request, we need you to sign our [Contributor License Agreement (CLA)](https://github.com/TNet-Tech/chacc-api/blob/develop/CLA.md).

            **To sign, please comment on this PR with exactly this phrase:**
