name: PR Title

# CONTRIBUTING.md requires Conventional Commits; this enforces it on the PR title
# (squash-merge uses the title as the commit message, so this keeps history clean).
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            perf
            style
            ci
          requireScope: false
