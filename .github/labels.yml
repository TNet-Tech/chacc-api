# Source of truth for repository labels. Synced by .github/workflows/sync-labels.yml
- { name: bug,                 color: d73a4a, description: "Something isn't working" }
- { name: enhancement,         color: a2eeef, description: "New feature or request" }
- { name: documentation,       color: 0075ca, description: "Improvements or additions to docs" }
- { name: triage,              color: ededed, description: "Needs maintainer review" }
- { name: good first issue,    color: 7057ff, description: "Good for newcomers" }
- { name: help wanted,         color: 008672, description: "Extra attention is needed" }
- { name: question,            color: d876e3, description: "Further information is requested" }
- { name: breaking change,     color: b60205, description: "Changes public behaviour or API" }
- { name: security,            color: ee0701, description: "Security-related change" }
- { name: dependencies,        color: 0366d6, description: "Dependency updates" }
- { name: tests,               color: fbca04, description: "Test-only changes" }
- { name: ci,                  color: 5319e7, description: "CI/CD and GitHub automation" }
- { name: "size: XS",          color: c2e0c6, description: "Under 10 changed lines" }
- { name: "size: S",           color: bfdadc, description: "10-49 changed lines" }
- { name: "size: M",           color: fef2c0, description: "50-249 changed lines" }
- { name: "size: L",           color: f9d0c4, description: "250-749 changed lines" }
- { name: "size: XL",          color: e99695, description: "750+ changed lines (consider splitting)" }
- { name: "area: core",        color: 1d76db, description: "Backbone / src" }
- { name: "area: modules",     color: 1d76db, description: "Module loader and management" }
- { name: "area: migrations",  color: 1d76db, description: "Database migration subsystem" }
- { name: "area: cli",         color: 1d76db, description: "The chacc CLI" }
- { name: "area: server",      color: 1d76db, description: "chacc_api server package" }
- { name: "area: docker",      color: 1d76db, description: "Docker and deployment" }
