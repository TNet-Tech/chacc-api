# ChaCC API - Docker Compose for Production
#
# Usage:
#   docker compose up -d                    # API + PostgreSQL
#   docker compose --profile redis up -d    # API + PostgreSQL + Redis
#
# Redis is optional. Use it to share rate-limit counts between containers and keep
# them across restarts, or for modules that use Redis. With the redis profile, set in .env:
#   REDIS_ENABLED=true
#   REDIS_HOST=redis
#   RATE_LIMIT_STORAGE_URI=redis://redis:6379/0


services:
  chacc:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.local
    image: chacc-api:latest
    container_name: chacc-api
    ports:
      - "8085:8085"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false   # only waited for when the redis profile is on
    volumes:
      - chacc_modules:/app/.modules_installed
      - chacc_plugins:/app/plugins
      - chacc_cache:/app/.chacc_cache
      - chacc_packages:/app/.chacc_packages
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; p = '/' + os.environ.get('API_PREFIX', '/api').strip('/'); urllib.request.urlopen('http://localhost:8085' + p.rstrip('/') + '/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - chacc-network

  db:
    image: postgres:16-alpine
    container_name: chacc-db
    environment:
      - POSTGRES_USER=chacc
      - POSTGRES_PASSWORD=${DB_PASSWORD:-chacc}
      - POSTGRES_DB=chacc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chacc -d chacc"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chacc-network
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: chacc-redis
    profiles: ["redis"]
    # Counts and module data survive restarts (append-only file).
    # To require a password: add --requirepass <password> here, and use
    # REDIS_PASSWORD=<password> and redis://:<password>@redis:6379/0 in .env.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chacc-network
    expose:
      - "6379"

volumes:
  postgres_data:
    driver: local
  chacc_modules:
    driver: local
  chacc_plugins:
    driver: local
  chacc_cache:
    driver: local
  chacc_packages:
    driver: local
  redis_data:
    driver: local

networks:
  chacc-network:
    driver: bridge
